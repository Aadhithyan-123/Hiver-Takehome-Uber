name: Hiver AI Agent Pipeline CI (@Uber_Support)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline Check
        run: |
          chmod +x run_pipeline.sh
          ./run_pipeline.sh

      - name: Verify Generated Artifacts
        run: |
          python -c "
          import os, json
          required_artifacts = [
              'results/metrics.json',
              'results/human_vs_judge.json',
              'results/confusion_matrix.csv',
              'results/cost_analysis.json',
              'results/judge_scores.jsonl',
              'results/predictions.jsonl'
          ]
          for path in required_artifacts:
              assert os.path.exists(path), f'Missing required CI artifact: {path}'
          
          with open('results/metrics.json') as f:
              m = json.load(f)
              assert m['eval_set_size'] == 200, 'Expected 200 evaluated items'
              print(f'CI Pipeline Passed! Accuracy: {m[\"proposed_agent\"][\"intent_accuracy\"]*100:.2f}%, Judge Score: {m[\"proposed_agent\"][\"llm_judge_summary\"][\"mean_total_score\"]:.2f}/10')
          "
